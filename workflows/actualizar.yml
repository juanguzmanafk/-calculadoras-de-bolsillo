.github/workflows/actualizar.yml: Actualizar datos del día

on:
  schedule:
    # 00:17 UTC = 21:17 en Argentina, todos los días
    - cron: "17 0 * * *"
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer datos nuevos
        run: node scripts/actualizar.mjs

      - name: Guardar cambios
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet || git commit -m "Datos del día $(date -u +%F)"
          git push
